name: Release

# Manual only (workflow_dispatch). Runs scripts/build-release.sh — the same script you run locally — and,
# if asked, uploads the artifacts to a GitHub Release with `gh`. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.9.0 or 1.0.0-rc1)"
        required: true
      publish:
        description: "Create/update the GitHub Release and upload the artifacts"
        type: boolean
        default: false
      kimodo_runner_run_id:
        description: "Optional: id of a successful 'kimodo-runner (optional)' run whose artifacts are bundled into tools/kimodo (empty = no runner)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read   # gh run download of the kimodo-runner artifacts

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  GODOT_VERSION: 4.7.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install NSIS, zip and AppImage prerequisites
        run: sudo apt-get update && sudo apt-get install -y nsis zip file libfuse2 desktop-file-utils p7zip-full

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-win-linux-templates

      - name: Install Godot .NET and export templates (official release, SHA512 verified)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          cd /tmp
          curl -sSfL -O "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -sSfL -O "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -sSfL -O "$base/SHA512-SUMS.txt"
          grep -E "Godot_v${GODOT_VERSION}-stable_mono_(linux_x86_64\.zip|export_templates\.tpz)" SHA512-SUMS.txt | sha512sum -c -
          sudo mkdir -p /opt/godot && sudo chown "$USER" /opt/godot
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip -d /opt/godot
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$dir"
          unzip -q -j -o Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz 'templates/version.txt' 'templates/windows_*x86_64*' 'templates/linux_*x86_64*' -d "$dir"

      - name: Get the kimodo-runner build (optional; never model weights)
        if: ${{ inputs.kimodo_runner_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.kimodo_runner_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "kimodo_runner_run_id must be a number"; exit 1; }
          mkdir -p build/cache
          # One multi-backend runner (CPU variants + Vulkan, DECISIONS D44) plus, when built, the CUDA backend and its runtime DLLs
          # in the same folder (scripts/build-release.sh picks these folders up and checks every SHA256SUMS*.txt). The CUDA files are
          # NOT bundled: build-release.sh moves them into the separate asset blazma-cuda-backend-<version>-win-x64.zip and writes
          # tools/kimodo/cuda-backend.json (its URL, size, SHA-256) so the app can offer it as an optional download (DECISIONS D47).
          gh run download "$RUN_ID" -n kimodo-runner-windows-x64 -D build/cache/kimodo-runner-win64
          gh run download "$RUN_ID" -n kimodo-runner-windows-x64-cuda -D build/cache/kimodo-runner-win64 || echo "no CUDA backend in run $RUN_ID (NVIDIA cards use Vulkan)"
          gh run download "$RUN_ID" -n kimodo-runner-linux-x64 -D build/cache/kimodo-runner-linux-x64 || echo "no Linux runner in run $RUN_ID"
          ls -la build/cache/kimodo-runner-win64

      - name: Build release (tests, exports, tools, zip, installer, tar.gz, AppImage, checksums)
        run: scripts/build-release.sh "${{ inputs.version }}"

      - name: Smoke test the artifacts (incl. the optional CUDA asset and the installer size)
        run: scripts/release-smoke.sh "${{ inputs.version }}"

      - name: Artifact sizes
        run: ls -l --block-size=M "build/release/${{ inputs.version }}/" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BlazmaAnimation-${{ inputs.version }}
          path: build/release/${{ inputs.version }}/
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"; d="build/release/$v"; tag="v$v"
          pre=""; case "$v" in *-*|0.*) pre="--prerelease";; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$d"/* --clobber
          else
            gh release create "$tag" "$d"/* --title "Blazma Animation $v" --notes-file "$d/RELEASE_NOTES-$v.md" $pre --target "${{ github.sha }}"
          fi
