name: Release

# Manual only (workflow_dispatch). Runs scripts/build-release.sh — the same script you run locally — and,
# if asked, uploads the artifacts to a GitHub Release with `gh`. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.9.0 or 1.0.0-rc1)"
        required: true
      publish:
        description: "Create/update the GitHub Release and upload the artifacts"
        type: boolean
        default: false
      kimodo_runner_run_id:
        description: "Optional: id of a successful 'kimodo-runner (optional)' run whose artifacts are bundled into tools/kimodo (empty = no runner)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read   # gh run download of the kimodo-runner artifacts

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  GODOT_VERSION: 4.7.2

jobs:
  # The Microsoft Visual C++ runtime DLLs that kimodo-runner and its GGML libraries need, shipped next to them in tools/kimodo
  # (app-local deployment, DECISIONS D49: no vc_redist.x64.exe, no administrator rights). Taken from the redistributable folder of
  # the Visual Studio on the Windows image (VC\Redist\MSVC\<version>\x64\Microsoft.VC14x.CRT and .OpenMP, the files Microsoft lists
  # as Distributable Code); each must carry a valid Microsoft Authenticode signature (checked by Windows here) and be 14.40 or newer.
  # The release job verifies the SHA-256 list written here and that every DLL in tools/kimodo resolves its imports.
  vcruntime:
    if: ${{ inputs.kimodo_runner_run_id != '' }}
    runs-on: windows-2022
    steps:
      - name: Collect and verify the Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $inst = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $inst) { throw 'no Visual Studio with the C++ tools on this image' }
          $ver = (Get-Content (Join-Path $inst 'VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt') -TotalCount 1).Trim()
          $x64 = Join-Path $inst "VC\Redist\MSVC\$ver\x64"
          $crt = Get-ChildItem $x64 -Directory -Filter 'Microsoft.VC14*.CRT' | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $x64 -Directory -Filter 'Microsoft.VC14*.OpenMP' | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not $omp) { throw "no Microsoft.VC14x.CRT / .OpenMP folder in $x64" }
          Write-Output "Visual C++ redist $ver from $($crt.FullName) and $($omp.FullName)"
          $out = 'vcruntime'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($f in 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll', 'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll',
                         'vcruntime140.dll', 'vcruntime140_1.dll', 'concrt140.dll') {
            Copy-Item (Join-Path $crt.FullName $f) $out
          }
          $threads = Join-Path $crt.FullName 'vcruntime140_threads.dll'
          if (Test-Path $threads) { Copy-Item $threads $out }
          Copy-Item (Join-Path $omp.FullName 'vcomp140.dll') $out
          $min = [Version]'14.40'
          foreach ($f in Get-ChildItem $out -Filter *.dll) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw "$($f.Name): not validly signed by Microsoft ($($sig.Status), $($sig.SignerCertificate.Subject))"
            }
            $vi = $f.VersionInfo
            $v = [Version]::new($vi.FileMajorPart, $vi.FileMinorPart, $vi.FileBuildPart, $vi.FilePrivatePart)
            if ($v -lt $min) { throw "$($f.Name) is version $v, older than $min" }
            Write-Output ("{0,-28} {1}  signed by {2}" -f $f.Name, $v, $sig.SignerCertificate.Subject)
          }
          Push-Location $out
          Get-ChildItem -File -Filter *.dll | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS-vcruntime.txt
          Get-Content SHA256SUMS-vcruntime.txt
          Pop-Location
          "Visual C++ runtime shipped app-local in tools/kimodo: $ver" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: vcruntime-win-x64
          path: vcruntime/
          retention-days: 7

  release:
    needs: vcruntime
    # Runs without the vcruntime job too (no runner bundled → no runtime needed), but never after it failed.
    if: ${{ !cancelled() && (needs.vcruntime.result == 'success' || needs.vcruntime.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install NSIS, zip and AppImage prerequisites
        run: sudo apt-get update && sudo apt-get install -y nsis zip file libfuse2 desktop-file-utils p7zip-full

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-win-linux-templates

      - name: Install Godot .NET and export templates (official release, SHA512 verified)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          cd /tmp
          curl -sSfL -O "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -sSfL -O "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -sSfL -O "$base/SHA512-SUMS.txt"
          grep -E "Godot_v${GODOT_VERSION}-stable_mono_(linux_x86_64\.zip|export_templates\.tpz)" SHA512-SUMS.txt | sha512sum -c -
          sudo mkdir -p /opt/godot && sudo chown "$USER" /opt/godot
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip -d /opt/godot
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$dir"
          unzip -q -j -o Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz 'templates/version.txt' 'templates/windows_*x86_64*' 'templates/linux_*x86_64*' -d "$dir"

      - name: Get the kimodo-runner build (optional; never model weights)
        if: ${{ inputs.kimodo_runner_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.kimodo_runner_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "kimodo_runner_run_id must be a number"; exit 1; }
          mkdir -p build/cache
          # One multi-backend runner (CPU variants + Vulkan, DECISIONS D44) plus, when built, the CUDA backend and its runtime DLLs
          # in the same folder (scripts/build-release.sh picks these folders up and checks every SHA256SUMS*.txt). The CUDA files are
          # NOT bundled: build-release.sh moves them into the separate asset blazma-cuda-backend-<version>-win-x64.zip and writes
          # tools/kimodo/cuda-backend.json (its URL, size, SHA-256) so the app can offer it as an optional download (DECISIONS D47).
          gh run download "$RUN_ID" -n kimodo-runner-windows-x64 -D build/cache/kimodo-runner-win64
          gh run download "$RUN_ID" -n kimodo-runner-windows-x64-cuda -D build/cache/kimodo-runner-win64 || echo "no CUDA backend in run $RUN_ID (NVIDIA cards use Vulkan)"
          gh run download "$RUN_ID" -n kimodo-runner-linux-x64 -D build/cache/kimodo-runner-linux-x64 || echo "no Linux runner in run $RUN_ID"
          ls -la build/cache/kimodo-runner-win64

      - name: Get the Visual C++ runtime DLLs (vcruntime job; copied next to kimodo-runner.exe, DECISIONS D49)
        if: ${{ inputs.kimodo_runner_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: vcruntime-win-x64
          path: build/cache/vcruntime-win64

      - name: Build release (tests, exports, tools, zip, installer, tar.gz, AppImage, checksums)
        run: scripts/build-release.sh "${{ inputs.version }}"

      - name: Smoke test the artifacts (incl. the optional CUDA asset and the installer size)
        run: scripts/release-smoke.sh "${{ inputs.version }}"

      - name: Artifact sizes
        run: ls -l --block-size=M "build/release/${{ inputs.version }}/" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BlazmaAnimation-${{ inputs.version }}
          path: build/release/${{ inputs.version }}/
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"; d="build/release/$v"; tag="v$v"
          pre=""; case "$v" in *-*|0.*) pre="--prerelease";; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$d"/* --clobber
          else
            gh release create "$tag" "$d"/* --title "Blazma Animation $v" --notes-file "$d/RELEASE_NOTES-$v.md" $pre --target "${{ github.sha }}"
          fi
