# One-off maintenance: move release tags to rewritten commits and tidy release notes. Manual only.
name: Retag releases
on:
  workflow_dispatch:
    inputs:
      map:
        description: "Space-separated tag=sha pairs"
        required: true
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move tags
        env:
          MAP: ${{ inputs.map }}
        run: |
          set -euo pipefail
          for pair in $MAP; do
            tag="${pair%%=*}"; sha="${pair#*=}"
            [[ "$tag" =~ ^v[0-9A-Za-z.\-]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad pair: $pair"; exit 1; }
            git cat-file -e "$sha^{commit}"
            git push --force origin "$sha:refs/tags/$tag"
          done
      - name: Tidy release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            gh release view "$tag" --json body -q .body > notes.md
            sed -i 's/مكتملة، بانتظار تجربتك مع Claude Code على Windows/مكتملة/; s/مراجعة Opus/مراجعة مستقلة/g; s/المراجعة الأمنية (Opus)/المراجعة الأمنية/g; s/^## المراجعة (Opus)$/## المراجعة/' notes.md
            gh release edit "$tag" --notes-file notes.md
          done
